<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0d0f" />
    <title>Offline — PrōjectBihar Newsfeed</title>
    <style>
      @font-face {
        font-family: Mackinac;
        src: url("/fonts/P22Mackinac-Book.woff2") format("woff2");
        font-display: swap;
      }
      body {
        margin: 0;
        background: #0d0d0f;
        color: #f5f5f7;
        font-family: Mackinac, Georgia, serif;
        line-height: 1.7;
      }
      main {
        max-width: 460px;
        margin: 12vh auto;
        padding: 32px;
      }
      .brand {
        font-size: 24px;
      }
      h1 {
        font-size: 36px;
        font-weight: 400;
        line-height: 1.2;
        margin-top: 48px;
      }
      p {
        color: #a1a1a6;
      }
      a {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 22px;
        border: 1px solid #444;
        border-radius: 999px;
        color: #f5f5f7;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid white;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">PrōjectBihar Newsfeed</div>
      <h1>You’re offline</h1>
      <p>
        Connect to the internet to read the latest Bihar news. The timeline needs a fresh connection
        to show the current seven-day window.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
