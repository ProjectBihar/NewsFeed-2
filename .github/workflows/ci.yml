name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes older runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JS dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          pip install -r extraction/requirements.txt
          pip install -r intelligence/requirements.txt

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: TypeScript tests
        # Includes browser acquisition against a local publisher fixture.
        # Chromium must be installed even though live crawls stay disabled.
        run: npm test

      - name: Build
        run: npm run build

      - name: PWA browser checks
        env:
          BASE_URL: http://localhost:3102
        run: |
          npm run start -- --port 3102 > /tmp/newsfeed-pwa-server.log 2>&1 &
          pwa_server_pid=$!
          trap 'kill "$pwa_server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:3102/manifest.webmanifest > /dev/null; then break; fi
            sleep 1
          done
          npm run check:pwa

      - name: Python tests
        run: pytest

      - name: Regression tests (golden pins + frozen evaluation)
        run: pytest tests/test_golden.py evaluation -q

      - name: Validate schema (migrations exist, PGlite applies them all)
        run: |
          test -n "$(ls supabase/migrations/*.sql)"
          npx vitest run tests/db-foundation.test.ts tests/source-registry.test.ts
