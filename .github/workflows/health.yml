name: health

# Plan §49: every 6 hours — source freshness, failure rates, volume
# anomalies, extraction degradation, feed staleness, blocked sources.
#
# Honesty note: live per-source checks need a configured database
# (checkSourceHealth is callable but unwired — see the §§45–51 entry in
# docs/IMPLEMENTATION_STATUS.md). This workflow guards the health
# contract offline: metric computation, assessment order
# (BLOCKED → BROKEN → STALE → DEGRADED → HEALTHY), and the drift gates.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Health contract (metrics, assessment, drift gates)
        run: npx vitest run crawler/health
