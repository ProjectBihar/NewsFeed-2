name: health

# Plan §49: every 6 hours — source freshness, failure rates, volume
# anomalies, extraction degradation, feed staleness, blocked sources.
#
# Live metric persistence requires PIPELINE_ENABLED=true and DATABASE_URL.
# Assessment and drift contracts always run first.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  health-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Health contract (metrics, assessment, drift gates)
        run: npx vitest run crawler/health

      - name: Build pipeline
        run: npm run pipeline:build

      - name: Persist live source health
        if: vars.PIPELINE_ENABLED == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          curl --fail --silent --show-error --location https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt --output "$RUNNER_TEMP/supabase-ca.crt"
          cat data/sources/certificates/official-intermediates.pem >> "$RUNNER_TEMP/supabase-ca.crt"
          NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/supabase-ca.crt" npm run pipeline:health -- 200
