name: discover

# Poll source endpoints every 45 minutes — discover URLs,
# normalise URLs, enqueue new URLs, record discovery metrics.
# Never fetch full articles.
#
# Live polling requires PIPELINE_ENABLED=true and a DATABASE_URL secret.
# Apply the reviewed migrations before enabling it.

on:
  schedule:
    # Repeating three-hour cycle: 00:13, 00:58, 01:43, 02:28 UTC.
    # Minute offsets avoid the busy start of each hour.
    - cron: "13,58 0-23/3 * * *"
    - cron: "43 1-23/3 * * *"
    - cron: "28 2-23/3 * * *"
  workflow_dispatch:
    inputs:
      verify-expansion:
        description: "Read-only verification of new source channels; skip live writes"
        type: boolean
        default: false

concurrency:
  group: discover-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discovery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Discovery contract (parsers, checkpoints, enqueue, registry)
        run: npx vitest run crawler/discovery crawler/queues crawler/normalisation tests/source-registry.test.ts

      - name: Build pipeline
        run: npm run pipeline:build

      - name: Verify expansion from the execution host
        if: inputs.verify-expansion
        env:
          NODE_EXTRA_CA_CERTS: data/sources/certificates/official-intermediates.pem
          SOURCE_VERIFICATION_OUTPUT: source-verification.json
        run: node scripts/verify-source-expansion.mjs

      - name: Save expansion verification
        if: always() && inputs.verify-expansion
        uses: actions/upload-artifact@v4
        with:
          name: source-verification
          path: source-verification.json

      - name: Discover live endpoints
        if: vars.PIPELINE_ENABLED == 'true' && !inputs.verify-expansion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          curl --fail --silent --show-error --location https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt --output "$RUNNER_TEMP/supabase-ca.crt"
          cat data/sources/certificates/official-intermediates.pem >> "$RUNNER_TEMP/supabase-ca.crt"
          NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/supabase-ca.crt" npm run pipeline:discover -- 100
